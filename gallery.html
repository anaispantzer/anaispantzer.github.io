<meta name="theme-color" content="#0b0910">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
<script>document.documentElement.classList.add('js')</script>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#ff5fa8}
@property --a2{syntax:'<color>';inherits:true;initial-value:#ffb26b}
:root{--bg:#0b0910;--surface:#15121e;--surface2:#1e1a2b;--text:#f3effb;--muted:#a8a2b8;--line:rgba(255,255,255,.13);--acc:#ff5fa8;--a2:#ffb26b;--ink:#0b0910;transition:--acc .9s ease,--a2 .9s ease;color-scheme:dark;
--disp:Anton,Impact,"Arial Narrow",sans-serif;--serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock,body.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
img{max-width:100%}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--acc);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60vmax 50vmax at 85% 6%,color-mix(in srgb,var(--acc) 26%,transparent),transparent 62%),radial-gradient(55vmax 45vmax at 0% 95%,color-mix(in srgb,var(--a2) 14%,transparent),transparent 62%)}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:150;opacity:.07;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-3%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
.prog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--acc),var(--a2));z-index:120}
/* cursor */
.cur,.ring{position:fixed;left:0;top:0;pointer-events:none;z-index:400;opacity:0;transition:opacity .3s}
.has-cursor .cur,.has-cursor .ring{opacity:1}
.cur{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;mix-blend-mode:difference}
.ring{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s,opacity .3s}
.ring span{font:700 10px/1 Inter,sans-serif;letter-spacing:.14em;color:var(--ink);opacity:0;transition:opacity .2s}
.ring.hov{width:70px;height:70px;margin:-35px 0 0 -35px;background:color-mix(in srgb,var(--acc) 28%,transparent)}
.ring.lbl{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--acc)}
.ring.lbl span{opacity:1}
@media (hover:hover) and (pointer:fine){.has-cursor,.has-cursor a,.has-cursor button,.has-cursor [role=button]{cursor:none}}
.spark{position:fixed;z-index:390;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--c,#fff);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .8s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(180deg) scale(0);opacity:0}}
/* header */
.top{position:fixed;left:0;right:0;top:0;z-index:110;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,3vw,36px);mix-blend-mode:difference;color:#fff;pointer-events:none}
.top>*{pointer-events:auto}
.logo{font:400 26px/1 var(--disp);text-decoration:none;letter-spacing:.04em}
.logo i{font-style:normal;display:inline-block;transition:transform .6s var(--ease)}
.logo:hover i{transform:rotate(180deg)}
.tools{display:flex;gap:10px;align-items:center}
.pill{border:1.5px solid #fff;background:transparent;border-radius:99px;padding:9px 16px;font:700 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.25s}
.pill:hover{background:#fff;color:#000}
@media (max-width:700px){.top{mix-blend-mode:normal;background:rgba(11,9,16,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 16px}.pill{padding:8px 13px}}
/* hero */
main{position:relative;z-index:1;overflow-x:clip}
.hero{padding:clamp(120px,18vw,210px) clamp(18px,4vw,60px) 0;max-width:1700px;margin:auto}
.kick{font:600 12px/1 Inter,sans-serif;letter-spacing:.4em;text-transform:uppercase;margin:0 0 18px;display:flex;align-items:center;gap:14px;color:var(--acc)}
.kick::before{content:"";width:46px;height:1.5px;background:currentColor}
h1{margin:0;font:400 clamp(40px,11vw,230px)/.9 var(--disp);text-transform:uppercase;background:linear-gradient(95deg,var(--acc),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.05em}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-top:18px}
.sub{margin:0;font:italic 400 clamp(24px,3.2vw,42px)/1.15 var(--serif)}
.count{display:flex;align-items:baseline;gap:12px;border-left:1.5px solid var(--acc);padding-left:16px}
.count b{font:400 clamp(44px,6vw,80px)/1 var(--disp);font-variant-numeric:tabular-nums}
.count span{font:600 11px/1.3 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
/* chips */
.bar{position:sticky;top:64px;z-index:50;margin:clamp(30px,5vw,60px) auto 0;max-width:1700px;padding:12px clamp(18px,4vw,60px)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:11px 20px;border-radius:99px;border:1.5px solid var(--line);background:rgba(11,9,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:700 12px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:.3s var(--ease);display:inline-flex;align-items:center;gap:9px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--cc);display:block}
.chip em{font-style:normal;color:var(--muted);font-weight:600;letter-spacing:.05em}
.chip:hover{border-color:var(--cc);transform:translateY(-2px)}
.chip.on{background:var(--cc);color:var(--ink);border-color:var(--cc)}
.chip.on i{background:var(--ink)}.chip.on em{color:color-mix(in srgb,var(--ink) 70%,transparent)}
@media (max-width:700px){.bar{top:52px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.chips{flex-wrap:nowrap;width:max-content}}
/* marquee */
.mq{overflow:hidden;white-space:nowrap;margin:clamp(30px,5vw,60px) 0 10px}
.mq .tr{display:inline-flex;will-change:transform}
.mq span{font:400 clamp(40px,7vw,100px)/1 var(--disp);text-transform:uppercase;padding:0 .35em;color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.5)}
.mq span:nth-child(4n+3){-webkit-text-stroke-color:var(--acc)}
/* grid */
.wrap{max-width:1700px;margin:auto;padding:20px clamp(18px,4vw,60px) 0}
.grid{display:flex;gap:clamp(10px,1.6vw,22px);align-items:flex-start;transition:opacity .28s,transform .28s var(--ease)}
.grid.swap{opacity:0;transform:translateY(16px)}
.col{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.6vw,22px);min-width:0}
.it{margin:0;position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--surface);line-height:0;transition:transform .5s var(--ease),filter .4s,opacity .8s var(--ease),box-shadow .4s}
.js .it:not(.in){opacity:0;transform:translateY(40px) scale(.97)}
.it img{width:100%;height:auto;display:block;transition:transform .9s var(--ease)}
.it figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;line-height:1.3;background:linear-gradient(0deg,rgba(5,4,9,.88),transparent);transform:translateY(100%);transition:transform .5s var(--ease);font:600 13px/1.3 Inter,sans-serif}
.it figcaption small{display:block;font:700 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--tc,var(--acc));margin-bottom:6px}
.it:hover figcaption,.it:focus-visible figcaption{transform:none}
.it:hover img{transform:scale(1.07)}
.it:hover{box-shadow:0 26px 60px -22px color-mix(in srgb,var(--tc,var(--acc)) 70%,transparent)}
@media (hover:hover){.grid:hover .it:not(:hover){filter:brightness(.55) saturate(.7)}}
@media (hover:none){.it figcaption{display:none}}
/* footer */
.credit{max-width:1700px;margin:clamp(50px,8vw,100px) auto 0;padding:0 clamp(18px,4vw,60px);color:var(--muted);font-size:14px}
.end{max-width:1700px;margin:26px auto 0;padding:0 clamp(18px,4vw,60px) 50px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 26px;border-radius:99px;background:var(--acc);color:var(--ink);font:700 14px/1 Inter,sans-serif;letter-spacing:.04em;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s;border:0}
.btn:hover{box-shadow:0 14px 40px -12px var(--acc)}
.btn.alt{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.alt:hover{border-color:var(--acc);color:var(--acc);box-shadow:none}
/* lightbox */
#lb{position:fixed;inset:0;z-index:300;background:rgba(5,4,9,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:70px 76px 20px;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#lb.open{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:calc(100svh - 190px);width:auto;height:auto;border-radius:14px;box-shadow:0 40px 100px -30px color-mix(in srgb,var(--acc) 55%,transparent);transform:scale(.96);transition:transform .6s var(--ease),opacity .3s;opacity:1}
#lb.open img{transform:none}
#lb img.ld{opacity:.2}
#lb .cap{text-align:center;font:600 15px/1.35 Inter,sans-serif}
#lb .cap small{display:block;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.06em;margin-top:6px}
#lb button{position:absolute;border-radius:50%;border:1.5px solid var(--line);background:rgba(30,26,43,.8);width:52px;height:52px;font-size:20px;display:grid;place-items:center;transition:.3s}
#lb button:hover{background:var(--acc);color:var(--ink);border-color:var(--acc)}
#lb .x{top:16px;right:16px}#lb .p{left:16px;top:50%;margin-top:-26px}#lb .n{right:16px;top:50%;margin-top:-26px}
@media (max-width:700px){#lb{padding:64px 12px 16px}#lb .p,#lb .n{top:auto;bottom:16px;margin:0;width:46px;height:46px}#lb .p{left:calc(50% - 56px)}#lb .n{right:calc(50% - 56px)}#lb img{max-height:calc(100svh - 230px)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.grain{animation:none}.js .it:not(.in){opacity:1;transform:none}}

</style>
</head>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var lang='en';try{lang=localStorage.getItem('lang')==='fr'?'fr':'en'}catch(e){}if(/[?&]lang=fr/.test(location.search))lang='fr';
var TAGS={

 korea:{c:'#ff5fa8',c2:'#b9a9e6',en:'Korea',fr:'Corée'},

var pool=$$('#pool .it'),grid=$('#grid'),cur='all',vis=[],idx=0;
/* captions */
pool.forEach(function(f){var t=f.dataset.t.split(' ')[0];f.style.setProperty('--tc',TAGS[t].c);f.setAttribute('tabindex','0');f.setAttribute('role','button');f.dataset.cursor='VIEW';var c=document.createElement('figcaption');c.innerHTML='<small></small><span></span>';f.appendChild(c)});

var chips=$('#chips');

var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.style.transitionDelay=(Math.min(5,+t.dataset.k||0)*70)+'ms,0s,0s,0s,0s';t.classList.add('in');io.unobserve(t);setTimeout(function(){t.style.transitionDelay=''},1200)}})},{threshold:.05,rootMargin:'0px 0px -4% 0px'}):null;
function layout(){
 vis=pool.filter(function(f){return cur==='all'||f.dataset.t.split(' ').indexOf(cur)>-1});

 vis.forEach(function(f,i){var im=$('img',f),m=hs.indexOf(Math.min.apply(null,hs));f.classList.remove('in');f.dataset.k=Math.floor(i/n);cols[m].appendChild(f);hs[m]+=im.height/im.width;if(io)io.observe(f);else f.classList.add('in')});
 $('#cnt').textContent=vis.length;
}
function setCap(){pool.forEach(function(f){var t=f.dataset.t.split(' ')[0];$('small',f).textContent=TAGS[t][lang];$('span',f).textContent=lang==='fr'?f.dataset.fr:f.dataset.en;$('img',f).alt=lang==='fr'?f.dataset.fr:f.dataset.en})}

});
/* lightbox */
var lb=$('#lb'),lbi=$('img',lb),lastF=null;
function show(i){idx=(i+vis.length)%vis.length;var f=vis[idx];lastF=f;lbi.classList.add('ld');

 lbi.alt=lang==='fr'?f.dataset.fr:f.dataset.en;$('.cap',lb).innerHTML=(lang==='fr'?f.dataset.fr:f.dataset.en)+'<small>© Anaïs Pantzer 2026 · '+(idx+1)+' / '+vis.length+'</small>';
 if(!lb.classList.contains('open')){lb.classList.add('open');root.classList.add('lock');body.classList.add('lock');$('.x',lb).focus({preventScroll:true})}}
function close(){lb.classList.remove('open');root.classList.remove('lock');body.classList.remove('lock');if(lastF)lastF.focus({preventScroll:true})}
grid.addEventListener('click',function(e){var f=e.target.closest('.it');if(f)show(vis.indexOf(f))});
grid.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var f=e.target.closest('.it');if(f){e.preventDefault();show(vis.indexOf(f))}}});
$('.x',lb).onclick=close;$('.p',lb).onclick=function(e){e.stopPropagation();show(idx-1)};$('.n',lb).onclick=function(e){e.stopPropagation();show(idx+1)};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});
var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(idx+(d<0?1:-1))});

var mq=$('.mq .tr');mq.innerHTML+=mq.innerHTML;mq.innerHTML+=mq.innerHTML;var mw=1,mx=0,lastY=scrollY,vel=0;

(function f(){var y=scrollY;vel+=((y-lastY)-vel)*.12;lastY=y;if(!reduce){mx-=1+Math.min(18,Math.abs(vel))*.9;if(mx<=-mw)mx+=mw;mq.style.transform='translate3d('+mx+'px,0,0)'}requestAnimationFrame(f)})();
var pg=$('#prog');function sc(){var h=document.documentElement.scrollHeight-innerHeight;pg.style.transform='scaleX('+(h>0?scrollY/h:0)+')'}
window.addEventListener('scroll',sc,{passive:true});sc();
/* cursor */
var ring=$('#ring'),dot=$('#cur'),rl=$('#ringl'),LB={VIEW:{en:'VIEW',fr:'VOIR'}};
if(fine&&!reduce){body.classList.add('has-cursor');var mx2=-100,my=-100,rx=-100,ry=-100;
 window.addEventListener('mousemove',function(e){mx2=e.clientX;my=e.clientY;dot.style.transform='translate3d('+mx2+'px,'+my+'px,0)';var t=e.target.closest&&e.target.closest('a,button,[role=button]');var c=t&&t.closest('[data-cursor]');ring.classList.toggle('hov',!!t&&!c);if(c){rl.textContent=(LB[c.dataset.cursor]||{en:c.dataset.cursor,fr:c.dataset.cursor})[lang];ring.classList.add('lbl')}else ring.classList.remove('lbl')});
 (function f(){rx+=(mx2-rx)*.18;ry+=(my-ry)*.18;ring.style.transform='translate3d('+rx+'px,'+ry+'px,0)';requestAnimationFrame(f)})();
 $$('.pill,.btn,.logo').forEach(function(el){el.addEventListener('mousemove',function(e){var r=el.getBoundingClientRect();el.style.transform='translate('+((e.clientX-r.left-r.width/2)*.25)+'px,'+((e.clientY-r.top-r.height/2)*.35)+'px)'});el.addEventListener('mouseleave',function(){el.style.transform=''})});
}
var COL=['#ff5fa8','#b9a9e6','#46e0ff','#c9ff4a','#ff8f3d'];
window.addEventListener('click',function(e){if(reduce||lb.classList.contains('open'))return;for(var i=0;i<9;i++){var s=document.createElement('i');s.className='spark';var a=Math.PI*2*i/9+Math.random()*.5,d=40+Math.random()*50;s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.setProperty('--c',COL[i%5]);body.appendChild(s);setTimeout(function(n){n.remove()},850,s)}});
/* language */
function apply(){root.lang=lang;$$('[data-en]').forEach(function(e){if(e.classList.contains('it'))return;e.textContent=lang==='fr'?e.dataset.fr:e.dataset.en});
 $$('.chip',chips).forEach(function(b){$('span',b).textContent=TAGS[b.dataset.c][lang]});setCap();
 $('#langbtn').textContent=lang==='fr'?'EN':'FR';$('#langbtn').setAttribute('aria-label',lang==='fr'?'Switch to English':'Passer en français');

 $('.x',lb).setAttribute('aria-label',lang==='fr'?'Fermer':'Close');
 try{localStorage.setItem('lang',lang)}catch(e){}
 if(lb.classList.contains('open'))show(idx);}
$('#langbtn').onclick=function(){lang=lang==='fr'?'en':'fr';apply()};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){meas();layout()},180)});
apply();layout();
})();

</script>
