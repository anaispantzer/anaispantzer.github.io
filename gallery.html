<style>
:root{--bg:#ebebeb;--surface:#fff;--text:#1d1b22;--muted:#5d5866;--lav:#a59dad;--accent:#5b4b8a;--line:#d6d2dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--surface:#1f1c27;--text:#ece9f1;--muted:#aaa4b6;--lav:#7c7488;--accent:#b9a9e6;--line:#34303f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131a;--surface:#1f1c27;--text:#ece9f1;--muted:#aaa4b6;--lav:#7c7488;--accent:#b9a9e6;--line:#34303f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-size:14px}
nav a,nav button{color:var(--muted);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}nav a:hover,nav button:hover{color:var(--accent)}
nav button{border:1px solid var(--line);border-radius:999px;padding:3px 12px}
main{max-width:1100px;margin:auto;padding:48px 20px 20px}
h1{font:400 clamp(40px,9vw,80px)/1.05 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--lav);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 16px;font:600 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:flex;gap:12px;align-items:flex-start}.col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.it{margin:0;border-radius:10px;overflow:hidden;background:var(--line);cursor:zoom-in;position:relative}
.it img{display:block;width:100%;height:auto;transition:transform .3s}.it:hover img{transform:scale(1.03)}
.credit{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 40px}
#lb{position:fixed;inset:0;background:rgba(10,8,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.open{display:flex}#lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:6px}
#lb .cap{color:#eee;font-size:14px;margin-top:12px;text-align:center}#lb .cap small{display:block;color:#aaa;font-size:12px}
#lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
#lb .x{top:14px;right:14px}#lb .p{left:12px;top:50%}#lb .n{right:12px;top:50%}
@media(max-width:600px){#lb .p,#lb .n{top:auto;bottom:14px}}

<div id="lb"><button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">‹</button><button class="n" aria-label="Next">›</button><img alt=""><div class="cap"></div></div>
<script>
(function(){
var lang='en';try{lang=localStorage.getItem('lang')||'en'}catch(e){}if(/[?&]lang=fr/.test(location.search))lang='fr';
var pool=[].slice.call(document.querySelectorAll('#pool .it')),grid=document.getElementById('grid'),cur='all',vis=[],idx=0;
function ncols(){var w=grid.clientWidth;return w<520?2:w<800?3:4}
function layout(){vis=pool.filter(function(f){return cur==='all'||f.dataset.t.split(' ').indexOf(cur)>-1});
grid.innerHTML='';var n=ncols(),cols=[],hs=[];for(var i=0;i<n;i++){var c=document.createElement('div');c.className='col';grid.appendChild(c);cols.push(c);hs.push(0)}
vis.forEach(function(f){var im=f.firstChild,m=hs.indexOf(Math.min.apply(null,hs));cols[m].appendChild(f);hs[m]+=im.height/im.width})}
function cap(f){return (lang==='fr'?f.dataset.fr:f.dataset.en)}
function show(i){idx=(i+vis.length)%vis.length;var f=vis[idx],lb=document.getElementById('lb');lb.querySelector('img').src=f.firstChild.dataset.full;lb.querySelector('img').alt=cap(f);lb.querySelector('.cap').innerHTML=cap(f)+'<small>© Anaïs Pantzer 2026 · '+(idx+1)+' / '+vis.length+'</small>';lb.classList.add('open')}
function close(){document.getElementById('lb').classList.remove('open')}
pool.forEach(function(f){f.addEventListener('click',function(){show(vis.indexOf(f))})});
var lb=document.getElementById('lb');lb.querySelector('.x').onclick=close;lb.querySelector('.p').onclick=function(e){e.stopPropagation();show(idx-1)};lb.querySelector('.n').onclick=function(e){e.stopPropagation();show(idx+1)};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});
var sx=0;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX});lb.addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(idx+(d<0?1:-1))});
document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on');cur=b.dataset.c;layout()}});
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(function(e){if(e.classList.contains('it'))return;e.textContent=lang==='fr'?e.dataset.fr:e.dataset.en});
document.getElementById('lang').textContent=lang==='fr'?'EN':'FR';document.title=lang==='fr'?'Photographie — Anaïs Pantzer':'Photography — Anaïs Pantzer';
var cnt={};pool.forEach(function(f){f.dataset.t.split(' ').forEach(function(t){cnt[t]=(cnt[t]||0)+1})});}
document.getElementById('lang').onclick=function(){lang=lang==='fr'?'en':'fr';try{localStorage.setItem('lang',lang)}catch(e){}apply()};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150)});
apply();layout();
})();
</script></body></html>
